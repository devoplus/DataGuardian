# Dependabot yapilandirmasi. Belgeler:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NuGet: uc proje de ayri dizinlerde. Yalnizca "/src" verilirse tests/ ve
  # samples/ altindaki paketler HIC izlenmez.
  - package-ecosystem: "nuget"
    directories:
      - "/src"
      - "/tests"
      - "/samples"
    schedule:
      interval: "weekly"

  # CI'daki action surumleri (checkout, setup-dotnet) NuGet ekosistemine dahil
  # degildir; bu giris olmadan hic guncellenmez.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
